[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-bench"
version = "0.1.0"
description = "Go2-X5 conveyor simulation, collection, and ConveyorVLA training."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
aml = ["torch>=2.6"]
conveyorvla = [
  "torch>=2.6",
  "transformers>=4.57",
  "safetensors>=0.6",
  "Pillow>=10",
  "accelerate>=1.14,<2",
  "deepspeed>=0.16.9,<0.17",
  "ninja>=1.11",
]
lerobot = [
  "lerobot==0.4.4",
  "Pillow>=10,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
