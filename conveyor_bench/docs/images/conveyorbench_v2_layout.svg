  </g>
  <g id="camera-wrist" data-role="policy_observation">
    <line x1="600" y1="721.4" x2="600" y2="466.14" stroke="#bcc8d2" stroke-width="9" stroke-linecap="round"/>
    <circle cx="600" cy="466.14" r="11" fill="#f3c866" stroke="#fff3bf" stroke-width="3"/>
    <path d="M 590 484.14 L 600 500.14 L 610 484.14" fill="none" stroke="#f3c866" stroke-width="3"/>
    <text x="616" y="471.14" class="camera-label" fill="#f3c866">C2</text>
  </g>
  <g id="camera-overview" data-role="observer_only" transform="translate(846 128)">
    <rect x="0" y="0" width="293" height="132" rx="14" fill="#162737" stroke="#47647b"/>
    <path d="M 18 17 h 24 l 9 8 v 22 h -33 z M 51 27 l 14 -8 v 27 l -14 -8 z" fill="#f3c866"/>
    <text x="78" y="29" class="camera-label" fill="#e8eef5">C1 HEAD · dog forward / 狗头前视</text>
    <text x="18" y="61" class="camera-label" fill="#e8eef5">C2 WRIST · above gripper, slight-down</text>
    <text x="18" y="91" class="camera-label" fill="#e8eef5">C3 OVERVIEW · pulled-back observer view</text>
    <text x="18" y="115" class="muted">C3 xyz [-2.8, -2.6, 3.2] m · not to scale</text>
  </g>
