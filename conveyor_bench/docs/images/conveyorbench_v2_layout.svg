<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ConveyorBench V2 top-view layout</title>
  <desc id="desc">横向传送带、近端分拣框、远端投放框、机器狗移动路线与三相机示意。</desc>
  <defs>
    <linearGradient id="belt-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263340"/>
      <stop offset="0.5" stop-color="#101820"/>
      <stop offset="1" stop-color="#263340"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38d8e8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55d68b"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.28"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, 'Noto Sans SC', sans-serif; fill: #e8eef5; }
    .muted { fill: #9eb0c2; font-size: 14px; }
    .bin-label { fill: #dce7f1; font-size: 13px; font-weight: 650; }
    .route { stroke: #55d68b; stroke-width: 5; stroke-dasharray: 12 10; fill: none; marker-end: url(#arrow-green); }
    .camera-label { font-size: 13px; font-weight: 650; }
  </style>
  <rect width="1200" height="820" fill="#09121b"/>
  <rect x="28" y="24" width="1144" height="772" rx="24" fill="#101d29" stroke="#274052" stroke-width="2"/>
  <text x="62" y="72" fill="#e8eef5" font-size="28" font-weight="750">ConveyorBench V2 · Top-view collection layout</text>
  <text x="62" y="101" class="muted">Near + remote profiles overlaid · near bins are disabled in the remote scene · geometry comes from local manifests.</text>
  <g id="navigation-corridor"><rect x="302.5" y="666.6" width="595" height="171.6" rx="28" fill="#143329" stroke="#285b49" stroke-width="2" stroke-dasharray="9 9"/></g>
  <g id="conveyor-belt" filter="url(#soft-shadow)">
    <rect x="316.8" y="352.86" width="566.4" height="128.28" rx="20" fill="#536270"/>
    <rect x="334.8" y="367.86" width="530.4" height="98.28" rx="12" fill="url(#belt-gradient)" stroke="#6d7c89" stroke-width="2"/>
    <line x1="393.73" y1="375.86" x2="393.73" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="452.67" y1="375.86" x2="452.67" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="511.6" y1="375.86" x2="511.6" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="570.53" y1="375.86" x2="570.53" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="629.47" y1="375.86" x2="629.47" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="688.4" y1="375.86" x2="688.4" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="747.33" y1="375.86" x2="747.33" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line x1="806.27" y1="375.86" x2="806.27" y2="458.14" stroke="#344553" stroke-width="2"/>
    <line id="direction-left-to-right" x1="430.27" y1="417" x2="769.73" y2="417" stroke="#38d8e8" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
    <text x="600" y="343.86" text-anchor="middle" fill="#e8eef5" font-size="19" font-weight="750">PART FLOW: LEFT → RIGHT / 左 → 右</text>
    <text x="600" y="454.14" text-anchor="middle" class="muted">belt top z = 0.34 m · world axis [0, -1, 0]</text>
  </g>
  <g id="representative-parts">
    <g class="part" data-geometry-kind="box">
      <rect id="part-00" data-object-id="part_red_block" fill="#dc4437" stroke="#f8fafc" stroke-width="2" x="427.88" y="399.12" width="26" height="22" rx="4"/>
    </g>
    <g class="part" data-geometry-kind="box">
      <rect id="part-01" data-object-id="part_blue_bar" fill="#2968d8" stroke="#f8fafc" stroke-width="2" x="533.96" y="417.79" width="26" height="22" rx="4"/>
    </g>
    <g class="part" data-geometry-kind="cylinder">
      <circle id="part-02" data-object-id="part_yellow_bushing" fill="#f0b014" stroke="#f8fafc" stroke-width="2" cx="653.04" cy="410.12" r="12"/>
