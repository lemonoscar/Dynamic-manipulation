    <circle cx="-48" cy="19" r="8" fill="#8ea1b1"/>
    <circle cx="48" cy="19" r="8" fill="#8ea1b1"/>
    <path d="M 0 -58 L -9 -46 L 9 -46 z" fill="#38d8e8"/>
    <text x="0" y="53" text-anchor="middle" fill="#e8eef5" font-size="14" font-weight="750">GO2-X5 START / 起点</text>
