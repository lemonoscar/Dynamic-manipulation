    <circle cx="334.8" cy="752.4" r="12" fill="#10261e" stroke="#55d68b" stroke-width="3"/>
    <path id="route-delivery_bin_yellow" class="route" d="M 600 752.4 L 865.2 752.4"/>
    <circle cx="865.2" cy="752.4" r="12" fill="#10261e" stroke="#55d68b" stroke-width="3"/>
    <text x="600" y="782" text-anchor="middle" class="muted">loaded base route · minimum displacement 0.65 m · standoff 0.42 m</text>
  </g>
  <g id="robot-start" transform="translate(600 752.4)" filter="url(#soft-shadow)">
